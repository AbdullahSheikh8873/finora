services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finora}
      POSTGRES_USER: ${POSTGRES_USER:-finora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finora} -d ${POSTGRES_DB:-finora}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finora_internal
    # Not published to the host/internet -- only reachable by the app
    # container over the internal network. See section 39 of the brief.

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finora}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - finora_internal
      - finora_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - finora_public

volumes:
  postgres_data:
    driver: local

networks:
  finora_internal:
    driver: bridge
  finora_public:
    driver: bridge
