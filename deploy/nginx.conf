# Finora reverse proxy configuration.
# Terminates HTTP (and, once a domain + certificate exist, HTTPS) and
# forwards everything to the FastAPI app container over the internal
# Docker network. See README.md "HTTPS" section for enabling Certbot.

upstream finora_app {
    server app:8000;
}

# Basic request-size and timeout hardening.
client_max_body_size 5m;

server {
    listen 80;
    server_name _;

    # Uncomment after DNS + Certbot are set up to redirect all HTTP to HTTPS:
    # return 301 https://$host$request_uri;

    location /static/ {
        proxy_pass http://finora_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    location /health {
        proxy_pass http://finora_app;
        access_log off;
    }

    location / {
        proxy_pass http://finora_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

