{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Notifications</h1>
    <div class="page-subtitle">Budget alerts and account activity</div>
  </div>
  <button class="btn btn-secondary" id="markAllReadBtn">Mark all as read</button>
</div>

<div class="card">
  <div id="notifList">
    <div style="padding:20px;"><div class="skeleton" style="height:60px;margin-bottom:10px;"></div><div class="skeleton" style="height:60px;"></div></div>
  </div>
  <div id="notifEmpty" class="hidden empty-state">
    <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>
    <h3>No notifications yet</h3>
    <p>Budget alerts and account activity will show up here.</p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/notifications.js"></script>
{% endblock %}
